services:
  - type: web
    name: study-buddy
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: CORS_ORIGINS
        sync: false
      - key: FIREBASE_WEB_CONFIG
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false